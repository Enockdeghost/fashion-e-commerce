{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ site_name }}{% endblock %}
{% block head %}
<style>
  .cms-page {
    padding: 8rem 5% 4rem;
    min-height: 80vh;
    background: var(--cream);
  }
  .cms-page .page-header {
    margin-bottom: 3rem;
  }
  .cms-page .page-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--brown);
    margin-bottom: 0.5rem;
  }
  .cms-page .page-content {
    max-width: 720px;
    font-size: 0.95rem;
    line-height: 2;
    color: var(--brown-lt);
    font-weight: 300;
  }
  .cms-page .page-content p {
    margin-bottom: 1.5rem;
  }
  .cms-page .back-link {
    display: inline-block;
    margin-top: 3rem;
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s;
  }
  .cms-page .back-link:hover {
    border-bottom-color: var(--gold);
  }
</style>
{% endblock %}

{% block content %}
<div class="cms-page">
  <div class="page-header">
    <h1>{{ page.title }}</h1>
  </div>
  <div class="page-content">
    {{ page.content | safe if page.content else 'Content coming soon.' }}
  </div>
  <a href="{{ url_for('frontend.index') }}" class="back-link">← Back to Home</a>
</div>
{% endblock %}
