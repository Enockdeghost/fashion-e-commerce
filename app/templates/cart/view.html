{% extends "base.html" %}
{% block title %}Shopping Bag | Fred Vunjabei{% endblock %}
{% block content %}
<section style="padding:8rem 5% 2rem;">
  <div style="font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; color:var(--brown-lt); margin-bottom:1rem;">
    <a href="{{ url_for('frontend.products') }}" style="color:var(--brown-lt);">← Continue Shopping</a>
  </div>
  <div class="section-header">
    <div>
      <div class="section-eyebrow">Your Selection</div>
      <h1 class="section-title">Shopping<br/><em>Bag</em></h1>
    </div>
  </div>
</section>

<section style="padding:2rem 5% 6rem;">
  <div id="cartItems">
    <p style="text-align:center;padding:4rem;">Loading your bag…</p>
  </div>
  <div style="text-align:right;margin-top:2rem;" id="checkoutBtn" hidden>
    <a href="{{ url_for('frontend.checkout') }}" class="btn-lv"><span>Proceed to Checkout</span></a>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
function formatPrice(amount) {
  if (amount == null) return '0 TZS';
  var num = parseFloat(amount);
  if (isNaN(num)) return '0 TZS';
  return 'TZS ' + num.toLocaleString();
}

function getCartToken() {
  var token = localStorage.getItem('cart_token');
  if (!token) {
    token = 'cart_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('cart_token', token);
  }
  return token;
}

var cartData = null;

function loadCart() {
  var token = getCartToken();
  var container = document.getElementById('cartItems');
  container.innerHTML = '<p style="text-align:center;padding:4rem;">Loading your bag…</p>';
  fetch('/api/cart', {headers:{'X-Cart-Token':token}})
    .then(function(r) { if (!r.ok) throw new Error('Cart API error'); return r.json(); })
    .then(function(d) {
      if (d.success && d.data && d.data.cart && d.data.cart.items && d.data.cart.items.length) {
        cartData = d.data.cart;
        renderCart(cartData);
        document.getElementById('checkoutBtn').hidden = false;
      } else {
        showEmptyCart();
      }
    })
    .catch(function() {
      showEmptyCart();
    });
}

function renderCart(cart) {
  var container = document.getElementById('cartItems');
  container.innerHTML = cart.items.map(function(item) {
    var p = item.product || {};
    var img = p.primary_image || item.image || 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=100&q=85';
    return '<div style="display:flex; gap:1.5rem; align-items:center; padding:1.5rem 0; border-bottom:1px solid var(--parchment);">' +
      '<img src="' + img + '" style="width:100px; height:100px; object-fit:cover;">' +
      '<div style="flex:1;">' +
        '<strong>' + (item.product_name || p.name) + '</strong><br>' +
        '<span style="font-size:0.75rem; color:var(--brown-lt);">' + (item.size||'') + ' ' + (item.color||'') + '</span><br>' +
        '<span style="font-size:0.75rem;">Qty: ' + item.quantity + '</span>' +
      '</div>' +
      '<div style="font-weight:600;">' + formatPrice(item.line_total) + '</div>' +
    '</div>';
  }).join('');
}

function showEmptyCart() {
  document.getElementById('cartItems').innerHTML = '<p style="text-align:center;padding:4rem;">Your bag is empty. <a href="' + '{{ url_for("frontend.products") }}' + '" style="color:var(--gold);">Start shopping</a></p>';
  document.getElementById('checkoutBtn').hidden = true;
}

document.addEventListener('DOMContentLoaded', loadCart);
</script>
{% endblock %}
