{% extends "base.html" %}
{% block title %}Order {{ order_number }} | {{ site_name }}{% endblock %}
{% block head %}
<style>
  .order-detail-page {
    padding: 8rem 5% 4rem;
    min-height: 100vh;
    background: var(--cream);
  }
  .order-detail-header {
    margin-bottom: 2.5rem;
  }
  .order-detail-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--brown);
    margin-bottom: 0.3rem;
  }
  .order-detail-header .meta {
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--brown-lt);
    text-transform: uppercase;
  }
  .order-detail-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 2.5rem;
  }
  .order-main, .order-summary {
    background: var(--white);
    border: 1px solid var(--parchment);
    padding: 2.5rem;
  }
  .order-main h2, .order-summary h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 1.5rem;
  }
  .order-item {
    display: flex;
    gap: 1.5rem;
    padding: 1.2rem 0;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    align-items: center;
  }
  .order-item:last-child {
    border-bottom: none;
  }
  .order-item img {
    width: 80px;
    height: 100px;
    object-fit: cover;
    background: var(--off-white);
  }
  .order-item-details h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 400;
    margin-bottom: 0.3rem;
  }
  .order-item-details .variant {
    font-size: 0.75rem;
    color: var(--brown-lt);
  }
  .order-summary-row {
    display: flex;
    justify-content: space-between;
    padding: 0.5rem 0;
    font-size: 0.9rem;
  }
  .order-summary-row.total {
    font-weight: 600;
    border-top: 1px solid rgba(0,0,0,0.1);
    margin-top: 0.5rem;
    padding-top: 1rem;
  }
  .status-badge {
    display: inline-block;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0.3rem 1rem;
    border: 1px solid;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 768px) {
    .order-detail-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="order-detail-page">
  <div class="order-detail-header">
    <h1>Order #{{ order_number }}</h1>
    <p class="meta">Placed on —</p>
  </div>
  <div class="order-detail-grid">
    <div class="order-main">
      <h2>Items</h2>
      <div id="orderItems">
        <p>Loading…</p>
      </div>
    </div>
    <div class="order-summary">
      <h3>Summary</h3>
      <div id="orderSummary">
        <p>Loading…</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function formatPrice(amount) {
    if (amount == null) return '0 TZS';
    var num = parseFloat(amount);
    if (isNaN(num)) return '0 TZS';
    return 'TZS ' + num.toLocaleString();
  }

  var orderNumber = '{{ order_number }}';
  var email = new URLSearchParams(window.location.search).get('email') || '';

  fetch('/api/orders/' + orderNumber + (email ? '?email=' + encodeURIComponent(email) : ''))
    .then(r => r.json())
    .then(d => {
      if (d.success && d.data) {
        var order = d.data;
        document.querySelector('.meta').textContent = 'Placed on ' + new Date(order.created_at).toLocaleDateString();
        
        var itemsHtml = order.items.map(function(item) {
          return '<div class="order-item">' +
            '<img src="' + (item.image_url || 'https://via.placeholder.com/80x100/f5f5f0/333333') + '" alt="' + item.product_name + '">' +
            '<div class="order-item-details">' +
              '<h4>' + item.product_name + '</h4>' +
              '<div class="variant">' + (item.size||'') + ' ' + (item.color||'') + ' × ' + item.quantity + '</div>' +
              '<div>' + formatPrice(item.line_total) + '</div>' +
            '</div>' +
          '</div>';
        }).join('');
        document.getElementById('orderItems').innerHTML = itemsHtml;

        var summaryHtml = '<div class="status-badge">' + (order.status || 'pending') + '</div>' +
          '<div class="order-summary-row"><span>Subtotal</span><span>' + formatPrice(order.subtotal) + '</span></div>' +
          '<div class="order-summary-row"><span>Shipping</span><span>' + formatPrice(order.shipping_amount) + '</span></div>' +
          '<div class="order-summary-row"><span>Discount</span><span>-' + formatPrice(order.discount_amount) + '</span></div>' +
          '<div class="order-summary-row total"><span>Total</span><span>' + formatPrice(order.total) + '</span></div>';
        document.getElementById('orderSummary').innerHTML = summaryHtml;
      } else {
        document.getElementById('orderItems').innerHTML = '<p>Order not found.</p>';
      }
    })
    .catch(function() {
      document.getElementById('orderItems').innerHTML = '<p>Error loading order.</p>';
    });
</script>
{% endblock %}
