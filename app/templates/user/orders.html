{% extends "base.html" %}
{% block title %}My Orders | Fred Vunjabei{% endblock %}
{% block head %}
<style>
  .orders-page {
    padding: 8rem 5% 4rem;
    min-height: 100vh;
    background: var(--cream);
  }
  .orders-header {
    margin-bottom: 3rem;
  }
  .orders-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--brown);
    margin-bottom: 0.5rem;
  }
  .orders-header p {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--brown-lt);
  }
  .orders-grid {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 2.5rem;
  }
  .sidebar {
    background: var(--white);
    border: 1px solid var(--parchment);
    padding: 2rem;
    height: fit-content;
  }
  .sidebar a {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.9rem 0;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brown);
    border-bottom: 1px solid rgba(0,0,0,0.04);
    transition: color 0.3s ease;
  }
  .sidebar a:last-child {
    border-bottom: none;
  }
  .sidebar a:hover,
  .sidebar a.active {
    color: var(--gold);
  }
  .sidebar a svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }
  .orders-content {
    background: var(--white);
    border: 1px solid var(--parchment);
    padding: 3rem;
  }
  .order-card {
    border-bottom: 1px solid rgba(0,0,0,0.05);
    padding: 1.8rem 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .order-card:last-child {
    border-bottom: none;
  }
  .order-info h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--brown);
    margin-bottom: 0.3rem;
  }
  .order-info .meta {
    font-size: 0.7rem;
    color: var(--brown-lt);
    letter-spacing: 1px;
  }
  .order-status {
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0.4rem 1.2rem;
    border: 1px solid;
  }
  .status-pending { color: #b8933a; border-color: #b8933a; }
  .status-paid { color: #2e7d32; border-color: #2e7d32; }
  .status-shipped { color: #1565c0; border-color: #1565c0; }
  .status-delivered { color: #1a0f00; border-color: #1a0f00; }
  .status-cancelled { color: #c0392b; border-color: #c0392b; }
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
  }
  .empty-state p {
    font-size: 0.9rem;
    color: var(--brown-lt);
    margin-bottom: 1.5rem;
  }
  @media (max-width: 768px) {
    .orders-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="orders-page">
  <div class="orders-header">
    <h1>My Orders</h1>
    <p>Track and manage your purchases</p>
  </div>
  <div class="orders-grid">
    <div class="sidebar">
      <a href="{{ url_for('frontend.dashboard') }}">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </a>
      <a href="{{ url_for('frontend.orders') }}" class="active">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/></svg>
        Orders
      </a>
      <a href="{{ url_for('frontend.wishlist') }}">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        Wishlist
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Profile
      </a>
    </div>
    <div class="orders-content" id="ordersContainer">
      <p style="text-align:center;padding:3rem;">Loading your orders…</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function formatPrice(amount) {
    if (amount == null) return '0 TZS';
    var num = parseFloat(amount);
    if (isNaN(num)) return '0 TZS';
    return 'TZS ' + num.toLocaleString();
  }

  function loadOrders() {
    var container = document.getElementById('ordersContainer');
    fetch('/api/orders', {headers:{'Authorization':'Bearer ' + (localStorage.getItem('admin_token')||'')}})
      .then(r => r.json())
      .then(d => {
        if (d.success && d.data && d.data.length) {
          container.innerHTML = d.data.map(function(order) {
            var statusClass = 'status-' + (order.status || 'pending');
            return '<div class="order-card">' +
              '<div class="order-info">' +
                '<h3>' + (order.order_number || 'Order') + '</h3>' +
                '<div class="meta">' + (order.created_at ? new Date(order.created_at).toLocaleDateString() : '') + ' · ' + formatPrice(order.total) + '</div>' +
              '</div>' +
              '<span class="order-status ' + statusClass + '">' + (order.status || 'pending') + '</span>' +
            '</div>';
          }).join('');
        } else {
          container.innerHTML = '<div class="empty-state"><p>You haven\'t placed any orders yet.</p><a href="' + '{{ url_for("frontend.products") }}' + '" class="quick-link">Start Shopping</a></div>';
        }
      })
      .catch(function() {
        container.innerHTML = '<div class="empty-state"><p>Could not load orders.</p></div>';
      });
  }

  document.addEventListener('DOMContentLoaded', loadOrders);
</script>
{% endblock %}
