{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join the world of LUXÉ</p>
            </div>
            
            <form id="register-form" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                    <span class="form-hint">Must be at least 8 characters</span>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter">
                        <span>Subscribe to our newsletter for exclusive updates</span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-large">Create Account</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
.auth-section {
    padding: var(--spacing-xxl) 0;
    min-height: 80vh;
    display: flex;
    align-items: center;
}

.auth-container {
    max-width: 500px;
    margin: 0 auto;
}

.auth-header {
    text-align: center;
    margin-bottom: var(--spacing-xl);
}

.auth-header h1 {
    font-family: var(--font-serif);
    font-size: 2rem;
    margin-bottom: var(--spacing-xs);
}

.auth-header p {
    color: var(--color-gray);
}

.auth-form {
    margin-bottom: var(--spacing-xl);
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--spacing-md);
}

.form-hint {
    display: block;
    font-size: 0.75rem;
    color: var(--color-gray-light);
    margin-top: var(--spacing-xs);
}

.checkbox-label {
    display: flex;
    align-items: flex-start;
    gap: var(--spacing-sm);
    cursor: pointer;
    font-size: 0.9rem;
}

.checkbox-label input {
    margin-top: 3px;
}

.auth-form .btn {
    width: 100%;
}

.auth-footer {
    text-align: center;
    padding: var(--spacing-lg) 0;
    border-top: 1px solid rgba(0,0,0,0.05);
}

.auth-footer p {
    font-size: 0.9rem;
    color: var(--color-gray);
}
</style>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
    }
    
    if (password.length < 8) {
        showToast('Password must be at least 8 characters', 'error');
        return;
    }
    
    const data = {
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: password
    };
    
    showLoading();
    
    // This would typically call a user registration endpoint
    // For now, we'll just show success
    setTimeout(() => {
        hideLoading();
        showToast('Account created successfully!', 'success');
        window.location.href = '{{ url_for("dashboard") }}';
    }, 1000);
});
</script>
{% endblock %}
