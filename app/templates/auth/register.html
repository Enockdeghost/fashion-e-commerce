{% extends "base.html" %}
{% block title %}Create Account | {{ site_name }}{% endblock %}
{% block head %}
<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6rem 5%;
    background: var(--cream);
  }
  .auth-card {
    width: 100%;
    max-width: 480px;
    background: var(--white);
    padding: 4rem 3rem;
    border: 1px solid var(--parchment);
  }
  .auth-card h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--brown);
    margin-bottom: 0.5rem;
  }
  .auth-card .subtitle {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--brown-lt);
    margin-bottom: 2.5rem;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
  }
  .form-group {
    margin-bottom: 1.8rem;
  }
  .form-group label {
    display: block;
    font-size: 0.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.6rem;
    font-weight: 600;
  }
  .form-group input {
    width: 100%;
    padding: 0.9rem 0;
    font-size: 0.9rem;
    border: none;
    border-bottom: 1px solid var(--parchment);
    background: transparent;
    color: var(--brown);
    font-family: 'Montserrat', sans-serif;
    outline: none;
    transition: border-color 0.3s;
  }
  .form-group input:focus { border-bottom-color: var(--gold); }
  .auth-btn {
    width: 100%;
    padding: 1.2rem;
    background: var(--brown);
    color: var(--cream);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background 0.3s, transform 0.3s;
    margin-top: 1rem;
  }
  .auth-btn:hover { background: var(--gold); color: var(--brown); transform: translateY(-2px); }
  .auth-link {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.75rem;
    color: var(--brown-lt);
  }
  .auth-link a {
    color: var(--gold);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s;
  }
  .auth-link a:hover { border-bottom-color: var(--gold); }
  .back-home {
    display: block;
    text-align: center;
    margin-top: 2rem;
    font-size: 0.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--brown-lt);
  }
  .back-home:hover { color: var(--gold); }
  @media (max-width: 480px) {
    .auth-card { padding: 2.5rem 1.5rem; }
    .form-row { grid-template-columns: 1fr; gap: 0; }
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Join the Maison</h1>
    <p class="subtitle">Create your personal account</p>
    <form id="registerForm" onsubmit="return handleRegister(event)">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="first_name" placeholder="Your first name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="last_name" placeholder="Your last name" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="········" required>
      </div>
      <button type="submit" class="auth-btn">Create Account</button>
    </form>
    <p class="auth-link">
      Already have an account? <a href="{{ url_for('frontend.login') }}">Sign in</a>
    </p>
    <a href="{{ url_for('frontend.index') }}" class="back-home">← Back to Home</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function handleRegister(e) {
    e.preventDefault();
    var first = document.getElementById('first_name').value.trim();
    var last = document.getElementById('last_name').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      showErrorToast('Please fill in all required fields.');
      return false;
    }

    fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ first_name: first, last_name: last, email: email, password: password })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        showSuccessToast('Account created. Redirecting…');
        setTimeout(() => { window.location.href = '/login'; }, 1200);
      } else {
        showErrorToast(d.error || 'Registration failed');
      }
    })
    .catch(() => showErrorToast('Network error.'));
    return false;
  }
</script>
{% endblock %}
