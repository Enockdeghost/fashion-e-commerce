{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Sign In</h1>
                <p>Welcome back to LUXÉ</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-large">Sign In</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
            </div>
            
            <div class="guest-checkout">
                <p>Or continue as guest</p>
                <a href="{{ url_for('products') }}" class="btn">Continue Shopping</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
.auth-section {
    padding: var(--spacing-xxl) 0;
    min-height: 80vh;
    display: flex;
    align-items: center;
}

.auth-container {
    max-width: 450px;
    margin: 0 auto;
}

.auth-header {
    text-align: center;
    margin-bottom: var(--spacing-xl);
}

.auth-header h1 {
    font-family: var(--font-serif);
    font-size: 2rem;
    margin-bottom: var(--spacing-xs);
}

.auth-header p {
    color: var(--color-gray);
}

.auth-form {
    margin-bottom: var(--spacing-xl);
}

.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--spacing-lg);
}

.remember-me {
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
    font-size: 0.9rem;
    cursor: pointer;
}

.forgot-link {
    font-size: 0.85rem;
    color: var(--color-gray);
}

.forgot-link:hover {
    color: var(--color-black);
}

.auth-form .btn {
    width: 100%;
}

.auth-footer {
    text-align: center;
    padding: var(--spacing-lg) 0;
    border-top: 1px solid rgba(0,0,0,0.05);
}

.auth-footer p {
    font-size: 0.9rem;
    color: var(--color-gray);
}

.guest-checkout {
    text-align: center;
    padding-top: var(--spacing-lg);
}

.guest-checkout p {
    font-size: 0.85rem;
    color: var(--color-gray);
    margin-bottom: var(--spacing-md);
}
</style>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    showLoading();
    
    fetch('/api/admin/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
    })
    .then(response => response.json())
    .then(data => {
        hideLoading();
        if (data.data) {
            localStorage.setItem('access_token', data.data.access_token);
            localStorage.setItem('refresh_token', data.data.refresh_token);
            showToast('Login successful', 'success');
            window.location.href = '{{ url_for("dashboard") }}';
        } else {
            showToast(data.error || 'Invalid credentials', 'error');
        }
    })
    .catch(error => {
        hideLoading();
        showToast('An error occurred', 'error');
    });
});
</script>
{% endblock %}
