{% extends "admin/base.html" %}
{% block title %}Brands{% endblock %}

{% block content %}
<div class="admin-page">
  <a href="{{ url_for('frontend.admin_dashboard') }}" class="back-link">← Back to Dashboard</a>
  <div class="sidebar">
    <a href="{{ url_for('frontend.admin_products') }}">Products</a>
    <a href="{{ url_for('frontend.admin_orders') }}">Orders</a>
    <a href="{{ url_for('frontend.admin_categories') }}">Categories</a>
    <a href="{{ url_for('frontend.admin_brands') }}" class="active">Brands</a>
    <a href="{{ url_for('frontend.admin_coupons') }}">Coupons</a>
    <a href="{{ url_for('frontend.admin_banners') }}">Banners</a>
    <a href="{{ url_for('frontend.admin_blog_list') }}">Blog</a>
  </div>

  <div class="admin-header">
    <h1>Brands</h1>
    <a href="{{ url_for('frontend.admin_brand_new') }}" class="btn btn-primary">+ Add Brand</a>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="brandsTableBody">
        <tr><td colspan="3" style="text-align:center;padding:2rem;">Loading brands…</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const token = localStorage.getItem('admin_token');
  if (!token) { window.location.href = '/admin'; }

  function loadBrands() {
    fetch('/api/brands', {
      headers: {'Authorization': 'Bearer ' + token}
    })
    .then(r => r.json())
    .then(d => {
      const tbody = document.getElementById('brandsTableBody');
      if (d.success && d.data && d.data.length) {
        tbody.innerHTML = d.data.map(b => `
          <tr>
            <td>${b.name || ''}</td>
            <td><span style="color:${b.is_active ? '#27ae60' : '#c0392b'};">${b.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>
              <a href="/admin/brands/${b.id}/edit" class="btn btn-ghost btn-sm">Edit</a>
              <button class="btn btn-danger btn-sm" onclick="deleteBrand('${b.id}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No brands found.</td></tr>';
      }
    })
    .catch(() => {
      document.getElementById('brandsTableBody').innerHTML = '<tr><td colspan="3" style="text-align:center;">Failed to load.</td></tr>';
    });
  }

  async function deleteBrand(brandId) {
    if (!confirm('Delete this brand?')) return;
    const resp = await fetch('/api/brands/' + brandId, {
      method: 'DELETE',
      headers: {'Authorization': 'Bearer ' + token}
    });
    const data = await resp.json();
    if (data.success) {
      loadBrands();
    } else {
      alert(data.error || 'Delete failed');
    }
  }

  document.addEventListener('DOMContentLoaded', loadBrands);
</script>
{% endblock %}
