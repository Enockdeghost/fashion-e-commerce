{% extends "base.html" %}
{% block title %}{% if product %}Edit{% else %}New{% endif %} Product | Fred Vunjabei{% endblock %}
{% block content %}
<div style="padding:6rem 5% 4rem; max-width:800px; margin:0 auto;">
  <h1 style="font-family:'Cormorant Garamond',serif; font-weight:300; font-size:2.2rem;">
    {% if product %}Edit Product{% else %}Add New Product{% endif %}
  </h1>

  <form id="productForm" style="display:flex;flex-direction:column;gap:1.5rem;margin-top:2rem;">
    <div>
      <label style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">Name</label>
      <input name="name" value="{{ product.name if product else '' }}" required
             style="width:100%;padding:0.9rem;border:1px solid var(--parchment);font-size:0.9rem;">
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
      <div>
        <label style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">Price (TZS)</label>
        <input name="base_price" type="number" step="0.01" value="{{ product.base_price if product else '' }}" required
               style="width:100%;padding:0.9rem;border:1px solid var(--parchment);font-size:0.9rem;">
      </div>
      <div>
        <label style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">Compare at Price</label>
        <input name="compare_price" type="number" step="0.01" value="{{ product.compare_price if product else '' }}"
               style="width:100%;padding:0.9rem;border:1px solid var(--parchment);font-size:0.9rem;">
      </div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
      <div>
        <label style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">Category</label>
        <select id="categorySelect" name="category_id" required
                style="width:100%;padding:0.9rem;border:1px solid var(--parchment);font-size:0.9rem;">
          <option value="">— Select —</option>
        </select>
      </div>
      <div>
        <label style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">Brand</label>
        <select id="brandSelect" name="brand_id"
                style="width:100%;padding:0.9rem;border:1px solid var(--parchment);font-size:0.9rem;">
          <option value="">— None —</option>
        </select>
      </div>
    </div>
    <div>
      <label style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">Description</label>
      <textarea name="description" rows="4"
                style="width:100%;padding:0.9rem;border:1px solid var(--parchment);font-size:0.9rem;">{{ product.description if product else '' }}</textarea>
    </div>
    <div>
      <label style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);">Meta Title (SEO)</label>
      <input name="meta_title" value="{{ product.meta_title if product else '' }}"
             style="width:100%;padding:0.9rem;border:1px solid var(--parchment);font-size:0.9rem;">
    </div>

    <button type="submit" class="btn-lv" style="align-self:flex-start;">
      <span>{% if product %}Update Product{% else %}Create Product{% endif %}</span>
    </button>
  </form>
  <div id="formMessage" style="margin-top:2rem;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Load categories and brands for dropdowns
  fetch('/api/categories').then(r => r.json()).then(d => {
    const sel = document.getElementById('categorySelect');
    if (d.data) {
      d.data.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o); });
    }
    {% if product and product.category_id %}
      sel.value = '{{ product.category_id }}';
    {% endif %}
  });
  fetch('/api/brands').then(r => r.json()).then(d => {
    const sel = document.getElementById('brandSelect');
    if (d.data) {
      d.data.forEach(b => { const o = document.createElement('option'); o.value = b.id; o.textContent = b.name; sel.appendChild(o); });
    }
    {% if product and product.brand_id %}
      sel.value = '{{ product.brand_id }}';
    {% endif %}
  });

  document.getElementById('productForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const payload = Object.fromEntries(formData);
    payload.base_price = parseFloat(payload.base_price);
    if (payload.compare_price) payload.compare_price = parseFloat(payload.compare_price);

    const token = localStorage.getItem('admin_token');
    const method = '{{ 'PUT' if product else 'POST' }}';
    const url = '{{ '/api/products/' + product.id if product else '/api/products' }}';

    fetch(url, {
      method: method,
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(d => {
      const msg = document.getElementById('formMessage');
      if (d.success) {
        alert('Product saved. Redirecting...', 'success');
        window.location.href = '/admin/products';
      } else {
        alert(d.error || 'Error saving product', 'error');
      }
    });
  });
    document.getElementById('uploadImageBtn').addEventListener('click', function() {
  const fileInput = document.getElementById('imageFile');
  const file = fileInput.files[0];
  if (!file) {
    alert('Please select an image file.', 'error');
    return;
  }
  const formData = new FormData();
  formData.append('image', file);
  const token = localStorage.getItem('admin_token');
  const productId = '{{ product.id if product else '' }}';

  if (!productId) {
    alert('Save the product first, then upload images.', 'info');
    return;
  }

  fetch('/api/products/' + productId + '/images', {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + token},
    body: formData
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) {
      const img = document.createElement('img');
      img.src = d.data.url;
      img.style.width = '100px';
      img.style.height = '100px';
      img.style.objectFit = 'cover';
      img.style.border = '1px solid var(--parchment)';
      document.getElementById('imagePreview').appendChild(img);
      fileInput.value = '';
      alert('Image uploaded.', 'success');
    } else {
      alert(d.error || 'Upload failed', 'error');
    }
  });
});
  
</script>
{% endblock %}
