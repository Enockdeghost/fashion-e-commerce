{% extends "admin/base.html" %}
{% block title %}{% if brand %}Edit{% else %}New{% endif %} Brand{% endblock %}

{% block content %}
<div class="admin-page">
  <a href="{{ url_for('frontend.admin_brands') }}" class="back-link">← Back to Brands</a>
  <div class="admin-header">
    <h1>{% if brand %}Edit Brand{% else %}Add New Brand{% endif %}</h1>
  </div>

  <div class="form-card">
    <form id="brandForm" onsubmit="return saveBrand(event)">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" id="brand_name" value="{{ brand.name if brand else '' }}" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" id="brand_description" rows="3">{{ brand.description if brand else '' }}</textarea>
      </div>

      <div class="form-group">
        <label>Logo URL</label>
        <input type="url" name="logo_url" id="brand_logo_url" placeholder="https://…" value="{{ brand.logo_url if brand else '' }}">
      </div>

      <div class="form-group">
        <label style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" name="is_active" id="brand_is_active" value="true" {% if brand and brand.is_active %}checked{% endif %}>
          Active
        </label>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary">
          {% if brand %}Update Brand{% else %}Create Brand{% endif %}
        </button>
        <a href="{{ url_for('frontend.admin_brands') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const token = localStorage.getItem('admin_token');
  if (!token) { window.location.href = '/admin'; }

  async function saveBrand(e) {
    e.preventDefault();
    const name = document.getElementById('brand_name').value.trim();
    const description = document.getElementById('brand_description').value.trim();
    const logo_url = document.getElementById('brand_logo_url').value.trim();
    const is_active = document.getElementById('brand_is_active').checked;

    if (!name) { alert('Name is required'); return; }

    const method = '{{ "PUT" if brand else "POST" }}';
    const url = '{{ "/api/brands/" + brand.id if brand else "/api/brands" }}';

    const payload = {
      name: name,
      description: description,
      logo_url: logo_url,
      is_active: is_active
    };

    try {
      const resp = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.success) {
        alert('Brand saved!');
        window.location.href = '/admin/brands';
      } else {
        alert(data.error || 'Save failed');
      }
    } catch (err) {
      alert('Network error');
    }
    return false;
  }
</script>
{% endblock %}
